<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - Pusat Gadai Indonesia</title>

    <!-- Google Fonts & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --primary-light: #fbbf24;
            --accent: #fbbf24;
            --dark-900: #0f0f1a;
            --dark-800: #1a1a2e;
            --dark-700: #16213e;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-600: #9ca3af;
            --gray-700: #e5e7eb;
            --gray-800: #f3f4f6;
            --gray-900: #ffffff;
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Background decorative elements - Dark with gold glow */
        body::before {
            content: "";
            position: absolute;
            top: -50%; right: -10%;
            width: 80%; height: 200%;
            background: radial-gradient(circle, rgba(245,158,11,0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            bottom: -20%; left: -10%;
            width: 70%; height: 150%;
            background: radial-gradient(circle, rgba(245,158,11,0.05) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        .particle:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
        .particle:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 30%; animation-delay: 4s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        /* Premium Glass Card */
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: var(--shadow-xl), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(245, 158, 11, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-header .icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #d97706, #f59e0b, #fbbf24);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4), 0 0 40px rgba(245, 158, 11, 0.1);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3), 0 0 40px rgba(245, 158, 11, 0.05); }
            50% { box-shadow: 0 10px 30px rgba(245, 158, 11, 0.5), 0 0 60px rgba(245, 158, 11, 0.15); }
        }

        .login-header .icon i {
            font-size: 2rem;
            color: white;
        }

        .login-header h3 {
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--gray-600);
            font-size: 0.9rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--gray-700);
            margin-bottom: 0.25rem;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            border-radius: 16px 0 0 16px;
            color: var(--primary);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-left: none;
            border-radius: 0 16px 16px 0;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #f3f4f6;
        }

        .form-control::placeholder {
            color: #6b7280;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
            outline: none;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-login {
            background: linear-gradient(135deg, #d97706, #f59e0b, #fbbf24);
            border: none;
            border-radius: 60px;
            padding: 0.8rem;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3), 0 0 20px rgba(245, 158, 11, 0.1);
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4), 0 0 30px rgba(245, 158, 11, 0.15);
        }

        .btn-login:hover::after {
            left: 100%;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .alert {
            border-radius: 16px;
            border: none;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
        }

        .alert-success {
            border-left-color: #34d399;
            color: #34d399;
        }

        .alert-danger {
            border-left-color: #f87171;
            color: #f87171;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 1.5rem;
            }
            .login-header .icon {
                width: 55px;
                height: 55px;
            }
            .login-header .icon i {
                font-size: 1.5rem;
            }
            .login-header h3 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="login-card" data-aos="fade-up" data-aos-duration="800">
        <div class="login-header">
            <div class="icon">
                <i class="fas fa-paw"></i>
            </div>
            <h3>ADMIN LOGIN</h3>
            <p>Masukkan kredensial untuk mengakses panel admin</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} d-flex align-items-center" role="alert">
                        <i class="fas fa-{{ 'check-circle' if category != 'error' else 'exclamation-triangle' }} me-2"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user me-1"></i> Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Masukkan username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-lock me-1"></i> Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i> Masuk
            </button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">
            <i class="fas fa-arrow-left me-1"></i> Kembali ke Beranda
        </a>
    </div>

    <!-- Font Awesome (for icons) -->
    <script src="https://kit.fontawesome.com/a6c6b8b8b8.js" crossorigin="anonymous"></script>
    <!-- If you prefer Bootstrap Icons, we already included, but Font Awesome gives more icon options -->
    <!-- Ensure Font Awesome loads; if not, use fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

    <!-- Optional AOS for animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, duration: 800 });
    </script>
</body>
</html>

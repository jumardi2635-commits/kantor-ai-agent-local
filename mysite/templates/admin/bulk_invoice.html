{% extends "admin/base_admin.html" %}
{% block title %}Bulk Invoice - Admin{% endblock %}
{% block content %}
<div class="p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Generate Bulk Invoice</h1>
    <div class="admin-card border-gray-700/50 p-6 max-w-2xl">
        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Pilih Order (Ctrl+Click untuk multiple)</label>
                <select name="order_ids" multiple size="10" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for order in orders %}
                    <option value="{{ order.id }}">{{ order.order_number }} - {{ order.customer_name }} - {{ format_price(order.total) }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex justify-end">
                <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-file-invoice mr-2"></i> Generate Invoice
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
